[build-system]
requires = [
    "setuptools>=80",
    "setuptools-rust>=1.11",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "entropython"
version = "1.3.1"
readme = "README.md"
description = "A Python module for efficient calculation of Shannon byte entropy and the chi-square statistic of the byte distribution based on Rust."
license = {file = "LICENSE"}
requires-python = ">= 3.10"
keywords = ["entropy", "shannon", "chi-square", "randomness"]

[project.urls]
Homepage = "https://github.com/fkie-cad/entropython"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "twine~=5.1.1",
    "build~=1.2.1",
]

[tool.setuptools.packages]
find = { where = ["python"] }

[[tool.setuptools-rust.ext-modules]]
target = "entropython.libentropython"
path = "Cargo.toml"
binding = "PyO3"
