[package]
name = "entropython"
version = "1.3.0"
authors = ["Enkelmann <nils-edvin.enkelmann@fkie.fraunhofer.de>"]
edition = "2021"
description = "A Python module for efficient calculation of Shannon byte entropy and the chi-square statistic of the byte distribution based on Rust."
readme = "README.md"
homepage = "https://github.com/fkie-cad/entropython"
repository =  "https://github.com/fkie-cad/entropython"
license = "MIT"
license-file = "LICENSE"
keywords = ["shannon", "entropy", "chi-square", "randomness"]

[lib]
name = "libentropython"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
